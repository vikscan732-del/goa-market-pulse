<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goa Bagayatdar Rates - Goa Market Pulse</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f6f8f7;
        }
    </style>
</head>
<body class="text-slate-800 antialiased pb-12">

    <!-- Header Section -->
    <header class="bg-white border-b border-slate-100 sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="index.html" class="w-9 h-9 rounded-xl bg-slate-100 flex items-center justify-center text-slate-600 hover:bg-slate-200 transition">
                    <i class="fas fa-arrow-left text-sm"></i>
                </a>
                <div>
                    <h1 class="text-base font-extrabold text-[#0e5e3a] leading-tight">Goa Bagayatdar</h1>
                    <p class="text-[11px] text-slate-400 font-medium">Official Commodity Rates</p>
                </div>
            </div>
            <span class="bg-[#e8f5ed] text-[#0e5e3a] text-[10px] font-bold px-2.5 py-1 rounded-full border border-green-200">
                Live Source
            </span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto px-4 mt-3 space-y-3">

        <!-- Search Bar -->
        <div class="relative">
            <i class="fas fa-search absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
            <input type="text" id="searchInput" placeholder="Search coconut, arecanut, spices..." 
                   class="w-full bg-white border border-slate-200 rounded-xl pl-9 pr-4 py-2.5 text-xs text-slate-700 placeholder-slate-400 focus:outline-none focus:border-[#0e5e3a] transition">
        </div>

        <!-- Info / Last Updated Bar -->
        <div class="bg-[#e8f5ed] text-[#0e5e3a] px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center justify-between">
            <span id="updateTime"><i class="far fa-clock mr-1"></i> Updated daily</span>
            <span id="productCount" class="text-[10px] bg-white text-[#0e5e3a] px-2 py-0.5 rounded-md font-bold">0 Items</span>
        </div>

        <!-- Product Cards Container -->
        <div id="product-list" class="space-y-2.5">
            <div class="text-center py-8 text-xs text-slate-400">Loading Bagayatdar items...</div>
        </div>

    </main>

    <!-- JavaScript to Load and Filter Products -->
    <script>
        let allProducts = [];

        async function loadBagayatdarData() {
            try {
                const res = await fetch('bagayatdar_data.json');
                const data = await res.json();
                
                allProducts = Array.isArray(data) ? data : (data.products || []);
                
                if(data.last_updated) {
                    document.getElementById('updateTime').innerHTML = `<i class="far fa-clock mr-1"></i> ${data.last_updated}`;
                }
                
                renderProducts(allProducts);
            } catch (err) {
                console.error("Error loading Bagayatdar data:", err);
                document.getElementById('product-list').innerHTML = `
                    <div class="bg-white p-4 rounded-2xl text-center text-xs text-red-500 border border-red-100">
                        Unable to load data. Please ensure <b>bagayatdar_data.json</b> is added.
                    </div>`;
            }
        }

        function renderProducts(items) {
            const container = document.getElementById('product-list');
            document.getElementById('productCount').textContent = `${items.length} Items`;

            if (items.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-xs text-slate-400">No items match your search.</div>`;
                return;
            }

            container.innerHTML = items.map(item => {
                const change = item.change || 0;
                const changePercent = item.changePercent || 0;
                const isDown = change < 0;
                const isUp = change > 0;
                const trendColor = isUp ? 'text-red-500' : isDown ? 'text-green-600' : 'text-slate-400';
                const trendIcon = isUp ? 'fa-arrow-up' : isDown ? 'fa-arrow-down' : 'fa-minus';

                return `
                    <div class="bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-11 h-11 bg-green-50 text-[#0e5e3a] rounded-xl flex items-center justify-center text-lg">
                                <i class="fas fa-seedling"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-xs text-slate-800">${item.name}</h3>
                                <div class="text-[10px] text-slate-400 flex gap-2 mt-0.5">
                                    ${item.highest ? `<span>High: ₹${item.highest}</span>` : ''}
                                    ${item.lowest ? `<span>Low: ₹${item.lowest}</span>` : ''}
                                </div>
                            </div>
                        </div>

                        <div class="text-right">
                            <div class="font-extrabold text-sm text-slate-800">
                                ₹${item.price}
                            </div>
                            <div class="text-[10px] font-semibold ${trendColor} flex items-center justify-end gap-1">
                                <i class="fas ${trendIcon} text-[8px]"></i>
                                <span>₹${Math.abs(change)} (${changePercent}%)</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Search Filter
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allProducts.filter(p => p.name.toLowerCase().includes(query));
            renderProducts(filtered);
        });

        document.addEventListener('DOMContentLoaded', loadBagayatdarData);
    </script>
</body>
</html>
