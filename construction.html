<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goa Construction Material Rates - Goa Market Pulse</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f6f8f7;
        }
        .accordion-content {
            transition: max-height 0.3s ease-out;
        }
    </style>
</head>
<body class="text-slate-800 antialiased pb-20">

    <!-- Header Section -->
    <header class="bg-white border-b border-slate-100 sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="index.html" class="w-9 h-9 rounded-xl bg-slate-100 flex items-center justify-center text-slate-600 hover:bg-slate-200 transition">
                    <i class="fas fa-arrow-left text-sm"></i>
                </a>
                <div>
                    <h1 class="text-base font-extrabold text-[#1d4ed8] leading-tight">Construction Rates</h1>
                    <p class="text-[11px] text-slate-400 font-medium">Cement, Steel, Sand & Building Supplies</p>
                </div>
            </div>
            <span class="bg-blue-50 text-[#1d4ed8] text-[10px] font-bold px-2.5 py-1 rounded-full border border-blue-200">
                Goa Market
            </span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-md mx-auto px-4 mt-3 space-y-3">

        <!-- Search Bar -->
        <div class="relative">
            <i class="fas fa-search absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
            <input type="text" id="searchInput" placeholder="Search cement, steel, sand, blocks..." 
                   class="w-full bg-white border border-slate-200 rounded-xl pl-9 pr-4 py-2.5 text-xs text-slate-700 placeholder-slate-400 focus:outline-none focus:border-[#1d4ed8] transition shadow-sm">
        </div>

        <!-- Quick Stats Overview -->
        <div class="grid grid-cols-3 gap-2">
            <div class="bg-white p-2.5 rounded-2xl border border-slate-100 shadow-sm text-center">
                <div id="statCategories" class="text-base font-extrabold text-[#1d4ed8]">0</div>
                <div class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider">Categories</div>
            </div>
            <div class="bg-white p-2.5 rounded-2xl border border-slate-100 shadow-sm text-center">
                <div id="statMaterials" class="text-base font-extrabold text-[#0e5e3a]">0</div>
                <div class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider">Materials</div>
            </div>
            <div class="bg-white p-2.5 rounded-2xl border border-slate-100 shadow-sm text-center">
                <div class="text-base font-extrabold text-amber-600">● Live</div>
                <div id="updateTime" class="text-[9px] text-slate-400 font-medium truncate">Today</div>
            </div>
        </div>

        <!-- Categories & Materials Container -->
        <div id="categoryContainer" class="space-y-3">
            <div class="text-center py-10 text-xs text-slate-400">Loading construction material rates...</div>
        </div>

    </main>

    <!-- Interactive Logic -->
    <script>
        let allCategories = [];

        const categoryThemes = [
            { border: "border-l-blue-500", bg: "bg-blue-50", badge: "bg-blue-100 text-blue-800" },
            { border: "border-l-amber-500", bg: "bg-amber-50", badge: "bg-amber-100 text-amber-800" },
            { border: "border-l-emerald-500", bg: "bg-emerald-50", badge: "bg-emerald-100 text-emerald-800" },
            { border: "border-l-purple-500", bg: "bg-purple-50", badge: "bg-purple-100 text-purple-800" },
            { border: "border-l-rose-500", bg: "bg-rose-50", badge: "bg-rose-100 text-rose-800" },
            { border: "border-l-teal-500", bg: "bg-teal-50", badge: "bg-teal-100 text-teal-800" }
        ];

        function formatIndianPrice(priceStr) {
            if (!priceStr) return "—";
            let clean = priceStr.replace(/[₹,\s]/g, '');
            const num = parseFloat(clean);
            if (isNaN(num)) return priceStr;
            return `₹${Number(num).toLocaleString('en-IN')}`;
        }

        async function loadConstructionData() {
            try {
                const res = await fetch('construction_data.json?t=' + Date.now());
                const data = await res.json();
                
                allCategories = data.categories || [];
                document.getElementById('updateTime').textContent = data.last_updated || "Today";
                renderCategories(allCategories);
            } catch (err) {
                console.error("Error loading construction data:", err);
                document.getElementById('categoryContainer').innerHTML = `
                    <div class="bg-white p-4 rounded-2xl text-center text-xs text-red-500 border border-red-100">
                        Unable to load data. Please verify <b>construction_data.json</b>.
                    </div>`;
            }
        }

        function renderCategories(list) {
            document.getElementById('statCategories').textContent = list.length;
            let totalMaterials = 0;
            list.forEach(c => totalMaterials += (c.items ? c.items.length : 0));
            document.getElementById('statMaterials').textContent = totalMaterials;

            const container = document.getElementById('categoryContainer');
            container.innerHTML = '';

            if (list.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-xs text-slate-400">No materials match your search.</div>`;
                return;
            }

            list.forEach((cat, idx) => {
                const theme = categoryThemes[idx % categoryThemes.length];
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden transition";

                const itemsHtml = (cat.items || []).map(item => `
                    <div class="flex items-center justify-between py-2.5 border-b border-slate-50 last:border-b-0">
                        <div class="pr-2">
                            <h4 class="font-bold text-xs text-slate-800">${item.name}</h4>
                            ${item.unit ? `<span class="text-[10px] text-slate-400 bg-slate-100 px-2 py-0.5 rounded-md font-medium mt-0.5 inline-block">${item.unit}</span>` : ''}
                        </div>
                        <div class="text-right">
                            <span class="inline-block bg-[#e8f5ed] text-[#0e5e3a] font-extrabold text-xs px-3 py-1 rounded-xl border border-green-200">
                                ${formatIndianPrice(item.price)}
                            </span>
                        </div>
                    </div>
                `).join('');

                card.innerHTML = `
                    <div class="category-header cursor-pointer p-3.5 flex items-center justify-between border-l-4 ${theme.border} hover:bg-slate-50 transition">
                        <div class="flex items-center gap-2.5">
                            <span class="text-lg">${cat.icon || '🏗️'}</span>
                            <span class="font-bold text-xs text-slate-800">${cat.category}</span>
                            <span class="text-[10px] ${theme.badge} font-bold px-2 py-0.5 rounded-full">${cat.items ? cat.items.length : 0}</span>
                        </div>
                        <i class="fas fa-chevron-down text-slate-400 text-xs transition-transform duration-200"></i>
                    </div>
                    <div class="category-body px-3.5 pb-3 pt-1 border-t border-slate-100 bg-[#fafcfb]">
                        ${itemsHtml}
                    </div>
                `;

                // Accordion toggle functionality
                const header = card.querySelector('.category-header');
                const body = card.querySelector('.category-body');
                const arrow = card.querySelector('i');

                // Keep first 2 open by default
                if (idx > 1) {
                    body.style.display = 'none';
                    arrow.style.transform = 'rotate(0deg)';
                } else {
                    body.style.display = 'block';
                    arrow.style.transform = 'rotate(180deg)';
                }

                header.addEventListener('click', () => {
                    const isOpen = body.style.display !== 'none';
                    body.style.display = isOpen ? 'none' : 'block';
                    arrow.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(180deg)';
                });

                container.appendChild(card);
            });
        }

        // Search Filter
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (!query) {
                renderCategories(allCategories);
                return;
            }

            const filtered = allCategories.map(cat => {
                const matched = (cat.items || []).filter(item => 
                    (cat.category + " " + item.name + " " + (item.unit || "")).toLowerCase().includes(query)
                );
                return { ...cat, items: matched };
            }).filter(cat => cat.items.length > 0);

            renderCategories(filtered);
            // Open all accordion cards when actively searching
            document.querySelectorAll('.category-body').forEach(b => b.style.display = 'block');
            document.querySelectorAll('.category-header i').forEach(i => i.style.transform = 'rotate(180deg)');
        });

        document.addEventListener('DOMContentLoaded', loadConstructionData);
    </script>
</body>
</html>
