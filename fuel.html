<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goa Fuel & LPG Rates - Goa Market Pulse</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fuel-card {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="text-slate-800 antialiased pb-20">

    <!-- Top Header -->
    <header class="bg-white border-b border-slate-100 sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="index.html" class="w-9 h-9 rounded-xl bg-slate-100 flex items-center justify-center text-slate-600 hover:bg-slate-200 transition">
                    <i class="fas fa-arrow-left text-sm"></i>
                </a>
                <div>
                    <h1 class="text-base font-extrabold text-[#e11d48] leading-tight">Fuel & LPG Rates</h1>
                    <p class="text-[11px] text-slate-400 font-medium">Daily Petrol, Diesel & Gas Tracker</p>
                </div>
            </div>
            <span class="bg-rose-50 text-[#e11d48] text-[10px] font-bold px-2.5 py-1 rounded-full border border-rose-200">
                Goa Market
            </span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-md mx-auto px-4 mt-3 space-y-3">

        <!-- Type Filter Tabs -->
        <div class="flex items-center justify-between bg-white border border-slate-100 p-1.5 rounded-2xl shadow-sm">
            <button onclick="filterCategory('all', this)" class="cat-btn flex-1 py-1.5 text-center text-xs font-bold rounded-xl bg-rose-600 text-white shadow-sm transition">All</button>
            <button onclick="filterCategory('petrol', this)" class="cat-btn flex-1 py-1.5 text-center text-xs font-bold rounded-xl text-slate-600 hover:text-slate-900 transition">Petrol</button>
            <button onclick="filterCategory('diesel', this)" class="cat-btn flex-1 py-1.5 text-center text-xs font-bold rounded-xl text-slate-600 hover:text-slate-900 transition">Diesel</button>
            <button onclick="filterCategory('cng', this)" class="cat-btn flex-1 py-1.5 text-center text-xs font-bold rounded-xl text-slate-600 hover:text-slate-900 transition">CNG/Gas</button>
            <button onclick="filterCategory('lpg', this)" class="cat-btn flex-1 py-1.5 text-center text-xs font-bold rounded-xl text-slate-600 hover:text-slate-900 transition">LPG</button>
        </div>

        <!-- Last Updated Tag -->
        <div class="bg-rose-50/70 border border-rose-100 px-3.5 py-2 rounded-xl text-xs flex items-center justify-between">
            <span id="updateTime" class="font-bold text-[#e11d48] text-[11px] flex items-center gap-1.5">
                <i class="far fa-clock"></i> Today, 06:00 AM
            </span>
            <span id="itemCount" class="bg-white text-rose-700 text-[10px] font-extrabold px-2 py-0.5 rounded-md border border-rose-100">0 Items</span>
        </div>

        <!-- Fuel Rate Cards List -->
        <div id="fuelContainer" class="space-y-2.5">
            <div class="bg-white p-6 rounded-2xl text-center text-xs text-slate-400 border border-slate-100 shadow-sm">
                <i class="fas fa-spinner fa-spin mr-1.5"></i> Loading fresh fuel rates...
            </div>
        </div>

    </main>

    <!-- JavaScript Data Rendering & Styling -->
    <script>
        let allFuels = [];
        let currentFilter = 'all';

        // High Quality 3D Icons & SVG Images from free public CDN
        const fuelVisuals = {
            petrol: {
                bg: "bg-red-50",
                border: "border-red-100",
                img: "https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Fuel%20pump/3D/fuel_pump_3d.png"
            },
            diesel: {
                bg: "bg-blue-50",
                border: "border-blue-100",
                img: "https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Oil%20drum/3D/oil_drum_3d.png"
            },
            cng: {
                bg: "bg-emerald-50",
                border: "border-emerald-100",
                img: "https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Leafy%20green/3D/leafy_green_3d.png",
                badgeText: "CNG"
            },
            lpg: {
                bg: "bg-amber-50",
                border: "border-amber-100",
                img: "https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Fire/3D/fire_3d.png",
                badgeText: "LPG"
            }
        };

        const defaultVisual = {
            bg: "bg-slate-50",
            border: "border-slate-100",
            img: "https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/Fuel%20pump/3D/fuel_pump_3d.png"
        };

        function formatIndianPrice(priceVal) {
            if (priceVal === null || priceVal === undefined || priceVal === "") return "₹—";
            const num = parseFloat(String(priceVal).replace(/[₹,\s]/g, ''));
            if (isNaN(num)) return `₹${priceVal}`;
            return `₹${num.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        }

        async function loadFuelData() {
            try {
                const res = await fetch('fuel_data.json?t=' + Date.now());
                if (!res.ok) throw new Error('fuel_data.json not reachable');
                const data = await res.json();
                
                allFuels = Array.isArray(data) ? data : (data.fuels || []);
                
                if (data.last_updated) {
                    document.getElementById('updateTime').innerHTML = `<i class="far fa-clock"></i> ${data.last_updated}`;
                }
                
                renderFuels(allFuels);
            } catch (err) {
                console.error("Error loading fuel data:", err);
                document.getElementById('fuelContainer').innerHTML = `
                    <div class="bg-white p-5 rounded-2xl text-center text-xs text-red-500 border border-red-100 shadow-sm">
                        ⚠️ Unable to load fuel prices. Please ensure <b>fuel_data.json</b> exists.
                    </div>`;
            }
        }

        function getVisualForFuel(item) {
            const name = (item.name || '').toLowerCase();
            const cat = (item.category || '').toLowerCase();

            if (name.includes('petrol') || cat === 'petrol') return fuelVisuals.petrol;
            if (name.includes('diesel') || cat === 'diesel') return fuelVisuals.diesel;
            if (name.includes('cng') || name.includes('auto gas') || cat === 'cng') return fuelVisuals.cng;
            if (name.includes('lpg') || name.includes('cylinder') || cat === 'lpg') return fuelVisuals.lpg;
            
            return defaultVisual;
        }

        function renderFuels(list) {
            const container = document.getElementById('fuelContainer');
            document.getElementById('itemCount').textContent = `${list.length} Items`;

            if (!list || list.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-xs text-slate-400 bg-white rounded-2xl border border-slate-100">No fuel prices found.</div>`;
                return;
            }

            container.innerHTML = list.map(item => {
                const visual = getVisualForFuel(item);
                const change = parseFloat(item.change) || 0;
                const changePct = parseFloat(item.changePercent) || 0;
                const isUp = change > 0;
                const isDown = change < 0;
                const trendColor = isUp ? 'text-rose-500' : isDown ? 'text-emerald-600' : 'text-slate-400';
                const trendIcon = isUp ? 'fa-arrow-up' : isDown ? 'fa-arrow-down' : 'fa-minus';

                // Custom Graphic Icon Box
                let iconContent = `<img src="${visual.img}" alt="fuel-icon" class="w-8 h-8 object-contain drop-shadow-sm">`;

                if (visual.badgeText === 'LPG') {
                    iconContent = `
                        <div class="relative flex items-center justify-center">
                            <span class="text-2xl">🔥</span>
                            <span class="absolute -bottom-1 bg-red-600 text-white text-[8px] font-black px-1 rounded shadow-xs">LPG</span>
                        </div>
                    `;
                } else if (visual.badgeText === 'CNG') {
                    iconContent = `
                        <div class="relative flex items-center justify-center">
                            <span class="text-2xl">⚡</span>
                            <span class="absolute -bottom-1 bg-emerald-600 text-white text-[8px] font-black px-1 rounded shadow-xs">CNG</span>
                        </div>
                    `;
                }

                return `
                    <div class="fuel-card bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between hover:shadow-md transition">
                        <!-- Left Details -->
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 ${visual.bg} ${visual.border} border rounded-2xl flex items-center justify-center shrink-0 shadow-inner">
                                ${iconContent}
                            </div>
                            <div>
                                <h3 class="font-bold text-xs text-slate-800 leading-snug">${item.name || 'Fuel Rate'}</h3>
                                <div class="text-[10px] text-slate-400 flex items-center gap-1 mt-0.5">
                                    <span>${item.district || 'Goa Region'}</span>
                                </div>
                            </div>
                        </div>

                        <!-- Right Price & Trend -->
                        <div class="text-right">
                            <div class="font-extrabold text-sm text-slate-800">
                                ${formatIndianPrice(item.price)} <span class="text-[9px] font-normal text-slate-400">/ ${item.unit || 'Litre'}</span>
                            </div>
                            <div class="text-[10px] font-semibold ${trendColor} flex items-center justify-end gap-1 mt-0.5">
                                <i class="fas ${trendIcon} text-[8px]"></i>
                                <span>₹${Math.abs(change).toFixed(2)} (${Math.abs(changePct).toFixed(2)}%)</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterCategory(cat, btn) {
            currentFilter = cat;
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.className = "cat-btn flex-1 py-1.5 text-center text-xs font-bold rounded-xl text-slate-600 hover:text-slate-900 transition";
            });
            btn.className = "cat-btn flex-1 py-1.5 text-center text-xs font-bold rounded-xl bg-rose-600 text-white shadow-sm transition";

            let filtered = allFuels;
            if (cat !== 'all') {
                filtered = allFuels.filter(f => {
                    const c = (f.category || '').toLowerCase();
                    const n = (f.name || '').toLowerCase();
                    if (cat === 'cng') return c.includes('cng') || n.includes('cng') || n.includes('auto gas');
                    return c.includes(cat) || n.includes(cat);
                });
            }
            renderFuels(filtered);
        }

        document.addEventListener('DOMContentLoaded', loadFuelData);
    </script>
</body>
</html>
