name: Daily Goa Market Scraper

on:
  schedule:
    # 30 21 * * * UTC corresponds to 03:00 AM IST every single day
    - cron: '30 21 * * *'
  # Allows you to run manually anytime from the GitHub Actions tab
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Step 1: Check out code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Install Tesseract OCR for vegetable scraper
      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libtesseract-dev

      # Step 4: Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow pytesseract

      # Step 5: Run Goa Bagayatdar Scraper
      - name: Run Goa Bagayatdar Scraper
        run: |
          python scraper/bagayatdar_scraper.py || echo "Bagayatdar scraper encountered an issue, proceeding..."

      # Step 6: Run Instagram OCR Vegetable Scraper
      - name: Run Instagram OCR Vegetable Scraper
        run: |
          python scraper/vegetable_scraper.py || echo "Vegetable OCR scraper encountered an issue, proceeding..."

      # Step 7: Run Construction Material Scraper
      - name: Run Construction Material Scraper
        run: |
          python scraper/construction_scraper.py || echo "Construction scraper encountered an issue, proceeding..."

      # Step 8: Run Fuel & LPG Scraper
      - name: Run Fuel Scraper
        run: |
          python scraper/fuel_scraper.py || echo "Fuel scraper encountered an issue, proceeding..."

      # Step 9: Run Gold & Silver Metal Scraper
      - name: Run Gold & Silver Scraper
        run: |
          python scraper/metal_scraper.py || echo "Metal scraper encountered an issue, proceeding..."

      # Step 10: Commit and push all updated JSON files and image
      - name: Commit and Push Updated Data & Latest Photo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.json history.json latest_price.jpg || true
          if git diff --staged --quiet; then
            echo "No changes today."
          else
            git commit -m "Auto-update market rates, fuel, gold and silver [$(date +'%Y-%m-%d')]"
            git push
          fi
