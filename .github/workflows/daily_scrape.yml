name: Daily Goa Market Scraper

on:
  schedule:
    # 30 21 * * * UTC corresponds to 03:00 AM IST every single day
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libtesseract-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow pytesseract

      - name: Run Goa Bagayatdar Scraper
        run: |
          python scraper/bagayatdar_scraper.py || echo "Bagayatdar scraper encountered an issue, proceeding..."

      - name: Run Instagram OCR Vegetable Scraper
        run: |
          python scraper/vegetable_scraper.py || echo "Vegetable OCR scraper encountered an issue, proceeding..."

      - name: Commit and Push Updated Data & Latest Photo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.json history.json latest_price.jpg || true
          if git diff --staged --quiet; then
            echo "No changes today."
          else
            git commit -m "Auto-update market rates and replace latest_price.jpg [$(date +'%Y-%m-%d')]"
            git push
          fi
